<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Cotizaciones IPSS</title>
  <link rel="stylesheet" href="cotizador_ipss.css">
</head>
<body>
  <div class="app-wrap">
    <h1 class="app-title">⚡ Generador de Cotizaciones — IPSS</h1>

    <div class="panel">
      <div class="panel-title">Configurar cotización</div>

      <div class="field">
        <label>Tipo de Programa</label>
        <div class="tipo-btns">
          <div class="tipo-btn active" id="btn-carreras">🎓 Carreras</div>
          <div class="tipo-btn" id="btn-diplomados">📜 Diplomados</div>
        </div>
      </div>

      <div class="field">
        <label id="lblPrograma">Carrera</label>
        <select id="selPrograma">
          <option value="">— Selecciona una carrera —</option>
        </select>
      </div>

      <div class="field" id="fieldModalidades">
        <label>Modalidad</label>
        <div class="mod-btns">
          <div class="mod-btn" id="btn-online">💻 Online</div>
          <div class="mod-btn" id="btn-diurno">☀️ Diurno</div>
          <div class="mod-btn" id="btn-vespertino">🌙 Vespertino</div>
        </div>
      </div>

      <div class="field">
        <label>N° de Cuotas</label>
        <div class="cuotas-btns">
          <div class="cuota-btn" id="cq-10">10 cuotas</div>
          <div class="cuota-btn" id="cq-12">12 cuotas</div>
          <div class="cuota-btn" id="cq-5" style="display:none">5 cuotas</div>
        </div>
      </div>

      <div class="field">
        <label>Opciones adicionales</label>
        <label class="check-row">
          <input type="checkbox" id="chkBene">
          <span>
            Aplicar <strong>beca</strong> sobre arancel + matrícula gratis
            <span class="desc-tag" id="descTag">−30% arancel</span>
          </span>
        </label>

        <div class="field beca-controls" style="margin-top:8px">
          <select id="becaSelect" disabled>
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
            <option value="25">25%</option>
            <option value="30" selected>30%</option>
            <option value="35">35%</option>
            <option value="40">40%</option>
            <option value="45">45%</option>
            <option value="50">50%</option>
          </select>
          <span class="beca-pct" id="becaPct">30%</span>
        </div>

        <label class="check-row" style="margin-top:9px">
          <input type="checkbox" id="chkDif">
          <span id="difLabel">Mostrar promoción: <strong>primera cuota diferida al 05 de junio</strong></span>
        </label>

        <div class="field">
          <label>Inicio de pago</label>
          <input type="date" id="inputFechaPago" value="2026-04-05">
        </div>
      </div>

      <button class="btn-gen">Generar tarjeta →</button>
    </div>

    <div class="preview-section" id="previewSection">
      <div class="preview-label">Vista previa — captura de pantalla o imprime</div>
      <div id="tarjetaContainer"></div>
      <div class="acciones">
        <button class="btn-accion btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
        <button class="btn-accion btn-how">📸 Cómo capturar</button>
      </div>
    </div>

    <div class="notif" id="notif"></div>
  </div>

  <script src="cotizador_ipss.js"></script>
</body>
</html>
